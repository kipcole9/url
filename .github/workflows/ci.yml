name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    name: "Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}${{ matrix.lint && ' (lint)' || '' }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Elixir 1.17 — supports OTP 25–27
          - elixir: "1.17.3-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.17.3-otp-27"
            otp: "27.3.4.17"

          # Elixir 1.18 — supports OTP 25–27
          - elixir: "1.18.5-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.18.5-otp-27"
            otp: "27.3.4.17"

          # Elixir 1.19 — supports OTP 26–28
          - elixir: "1.19.6-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.19.6-otp-27"
            otp: "27.3.4.17"
          - elixir: "1.19.6-otp-28"
            otp: "28.5.0.6"

          # Elixir 1.20 — supports OTP 27–29
          - elixir: "1.20.4-otp-27"
            otp: "27.3.4.17"
          - elixir: "1.20.4-otp-28"
            otp: "28.5.0.6"
          - elixir: "1.20.4-otp-29"
            otp: "29.1"
            lint: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # The key carries both the Elixir and the OTP version: compiled
      # BEAMs are tagged with the OTP they were built on, so a cache
      # shared across OTPs poisons every other row of the matrix.
      - name: Restore dependency cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Restore PLT cache
        if: matrix.lint
        uses: actions/cache@v5
        with:
          path: _build/dev/dialyxir_*
          key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Run dialyzer
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: mix dialyzer
